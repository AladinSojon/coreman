spring:
  application:
    name: coreman-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/coreman}?prepareThreshold=0
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:coreman-default-dev-secret-key-change-in-production-must-be-at-least-256-bits-long}
  access-token-expiry: 900000       # 15 minutes
  refresh-token-expiry: 604800000   # 7 days

# Stripe Configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

# Logging
logging:
  level:
    com.coreman: DEBUG
    org.springframework.security: INFO

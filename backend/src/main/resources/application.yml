spring:
  application:
    name: coreman-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/coreman}?prepareThreshold=0
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      continue-on-error: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      fail-on-empty-beans: false
    default-property-inclusion: non_null

  # Email (password reset). Leave MAIL_HOST empty to turn email off; any SMTP works,
  # e.g. Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=you@gmail.com, MAIL_PASSWORD=<app password>.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:coreman-default-dev-secret-key-change-in-production-must-be-at-least-256-bits-long}
  access-token-expiry: 900000       # 15 minutes
  refresh-token-expiry: 604800000   # 7 days

# Stripe Configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

# Inserts any missing standard categories on startup (never edits existing ones)
coreman:
  seed-categories: ${SEED_CATEGORIES:true}
  # Public URLs: SSLCommerz sends customers back to the backend, which then redirects to the shop.
  backend-url: ${BACKEND_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  payments:
    unpaid-timeout-minutes: 60   # unpaid online orders are cancelled (stock returned) after this
    sslcommerz:
      # Online payment is enabled when both are set. Get sandbox keys at developer.sslcommerz.com.
      store-id: ${SSLCOMMERZ_STORE_ID:}
      store-password: ${SSLCOMMERZ_STORE_PASSWORD:}
      sandbox: ${SSLCOMMERZ_SANDBOX:true}   # set to false with your LIVE store credentials
  # Sender shown on emails, e.g. "CoreMan <you@gmail.com>" (defaults to MAIL_USERNAME)
  mail-from: ${MAIL_FROM:}
  # Photos uploaded in Admin are stored here and served at /api/uploads/...
  upload-dir: ${UPLOAD_DIR:${user.home}/.coreman/uploads}
  # Automatic collections
  collections:
    new-days: 30            # a product is a New Arrival for this many days after it's added (unless "new until" is set)
    best-seller-days: 90    # Best Sellers = most units sold in this window, cancelled orders excluded
    best-seller-min: 8      # if fewer products have sales, top up with Featured products

# Logging
logging:
  level:
    com.coreman: DEBUG
    org.springframework.security: INFO
